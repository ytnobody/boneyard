name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Shellcheck lint
        run: |
          shellcheck scripts/*.sh || true

      - name: Run unit tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/test-all.sh

      - name: Verify search.json is up to date
        run: |
          TMP=$(mktemp -d)
          ./scripts/build-search.sh "$TMP/search.json" >/dev/null 2>&1
          if ! diff -q "$TMP/search.json" index/search.json >/dev/null; then
            echo "error: index/search.json is out of date."
            echo "Re-run: ./scripts/build-search.sh"
            diff "$TMP/search.json" index/search.json || true
            exit 1
          fi
          echo "index/search.json is up to date"